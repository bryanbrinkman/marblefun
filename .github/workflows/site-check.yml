# Manual diagnostics for the public site: DNS, TLS and HTTP for both hosts
# (marblefun.fly.dev and marblerun.fun) from a GitHub runner, plus the Fly
# app's own view (IPs, certificates, status, recent logs) using the deploy
# token. Read-only. Run it from the Actions tab, or bump the `run:` comment
# below to re-run on push.
name: site-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/site-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DNS (A / AAAA / CNAME) for both hosts
        run: |
          # run: 23
          for h in marblerun.fun www.marblerun.fun marblefun.fly.dev; do
            echo "=== $h"
            for t in A AAAA CNAME; do echo "-- $t"; dig +short "$t" "$h" @1.1.1.1 || true; done
          done
      - name: HTTP over IPv4 (headers + /api/version)
        run: |
          for h in marblefun.fly.dev marblerun.fun; do
            echo "=== https://$h/ (IPv4)"
            curl -4 -sS -o /dev/null -D - --max-time 20 "https://$h/" || echo "curl failed: $?"
            echo "--- /api/version"; curl -4 -sS --max-time 20 "https://$h/api/version" || echo "curl failed: $?"; echo
            echo "--- http:// (expect redirect)"; curl -4 -sS -o /dev/null -D - --max-time 20 "http://$h/" | head -5 || true
          done
      - name: Served page markers (what the public page actually ships)
        run: |
          for h in marblefun.fly.dev marblerun.fun; do
            echo "=== $h"
            echo "--- index.html markers"; curl -4 -sS --max-time 20 "https://$h/" | grep -o 'class="ss-loading"\|class="ss-logo"\|id="ssStatus"\|id="ssBar"\|id="ssWhy"\|class="mm-change"\|id="ssOpenTournament"\|class="replay-chip"' | sort | uniq -c
            echo "--- viewer.js markers"; curl -4 -sS --max-time 20 "https://$h/viewer.js" | grep -c '__boot\|SS_WHY_DRAWER\|raceHeader\|replayRequest\|Your pick raced here\|ssReplayLive\|renderStageFallbackLive' || true
            echo "--- viewer.css markers"; curl -4 -sS --max-time 20 "https://$h/viewer.css" | grep -c 'ss-failed.compact\|\.mm-acts\|max-width: 360px' || true
            echo "--- marble_run.html markers"; curl -4 -sS --max-time 20 "https://$h/marble_run.html" | grep -c 'html.embed #loadingOverlay\|window.__boot\|stallStats\|segment.s own direction\|PARKED_LIFT\|finial.userData.noPrint\|node.userData.isMarble) return\|function splitProfileAt\|COURSE_GEN_LATEST = 2\|buildSplitChannel' || true
            echo "--- gallery markers"; curl -4 -sS --max-time 20 "https://$h/gallery" | grep -o 'The Lost Marble Collection\|class="case"\|class="plaque"\|class="floor"\|class="box-floor"\|class="box-lip"\|id="viewList"\|class="box-top"\|mix-blend-mode: multiply\|clip-path: polygon\|class="brand-logo"\|id="dShare"\|image-set(\|Champion</span>\|Your pick\|id="listHead"\|class="m-cols"\|No owner credited\|class="site-nav"' | sort | uniq -c
            echo "--- champions markers"; curl -4 -sS --max-time 20 "https://$h/champions" | grep -o 'The Hall of Champions\|class="gap\|class="champ"\|<summary>Technical details</summary>\|title</span>\|completed tournaments\|cut short\|class="site-nav"\|id="titlesMore"\|id="titleRows"\|View full standings' | sort | uniq -c
            echo "--- print markers"; curl -4 -sS --max-time 20 "https://$h/print" | grep -o 'print-state.js\|id="previewOff"\|class="site-nav"\|data-level="idle"\|id="pieceOpts"\|id="statusTech"\|id="previewTech"\|id="exportNote"\|Settings changed' | sort | uniq -c
            echo "--- shared sheet + state module"; for f in site.css print-state.js; do curl -4 -sS -o /dev/null -w "$f %{http_code} %{content_type} %{size_download}\n" --max-time 20 "https://$h/$f"; done
            echo "--- champions API coverage"; curl -4 -sS --max-time 20 "https://$h/api/champions?limit=3" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("coverage", d.get("coverage")); print("gaps", [(g["tournamentId"], g["status"]) for g in d.get("gaps", [])][:12]); print("history", [(h["tournamentId"], h["champion"]["id"], h.get("titleNumber"), h.get("lifetimeTitles")) for h in d.get("history", [])])'
            echo "--- course generation on recent races"; curl -4 -sS --max-time 20 "https://$h/api/history?limit=3" | python3 -c 'import json,sys; d=json.load(sys.stdin); print([(r["raceKey"], r["trackSeed"], r.get("courseGen")) for r in d.get("races", [])])'
            echo "--- hall of fame: holder titles vs table"; curl -4 -sS --max-time 20 "https://$h/api/hall-of-fame" | python3 -c 'import json,sys; d=json.load(sys.stdin); c=d.get("currentChampion") or {}; t=d.get("titleTable") or []; row=next((r for r in t if r.get("id")==c.get("id")), None); print("holder", c.get("id"), c.get("name"), "titles", c.get("titles"), "| table row", row, "| table", len(t), "most", len(d.get("mostTitles") or []))'
            echo "--- wood texture"; curl -4 -sS -o /dev/null -D - --max-time 20 "https://$h/textures/wood-h.png" | grep -i 'HTTP/\|content-type\|content-length\|cache-control' || true
            echo "--- 1024px thumbnail (#1)"; curl -4 -sS -o /dev/null -D - --max-time 20 "https://$h/marbles/thumb/1@2x.webp" | grep -i 'HTTP/\|content-type\|content-length\|location' || true
            echo "--- manifest img2x entries"; curl -4 -sS --max-time 20 "https://$h/marbles/manifest.json" | grep -o '@2x.webp' | wc -l
            echo "--- cache headers"; curl -4 -sS -o /dev/null -D - --max-time 20 "https://$h/viewer.js" | grep -i 'cache-control\|last-modified\|etag' || true
          done
      - name: HTTP over IPv6 (if the runner has it)
        continue-on-error: true
        run: |
          ip -6 addr | grep -q "scope global" && echo "runner has global IPv6" || echo "runner has NO global IPv6 — skipping v6 fetches"
          for h in marblefun.fly.dev marblerun.fun; do
            echo "=== https://$h/ (IPv6)"; curl -6 -sS -o /dev/null -D - --max-time 20 "https://$h/" || echo "curl -6 failed: $?"
          done
      - name: TLS certificate presented for marblerun.fun
        continue-on-error: true
        run: |
          echo | openssl s_client -servername marblerun.fun -connect marblerun.fun:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || echo "no certificate"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly app view (IPs, certs, status)
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== ips";    flyctl ips list -a marblefun || true
          echo "=== certs";  flyctl certs list -a marblefun || true
          echo "=== cert check marblerun.fun"; flyctl certs check marblerun.fun -a marblefun || true
          echo "=== cert show marblerun.fun";  flyctl certs show  marblerun.fun -a marblefun || true
          echo "=== status"; flyctl status -a marblefun || true
          echo "=== apps on this account"; flyctl apps list 2>&1 || true
      - name: Fly recent logs
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          timeout 25 flyctl logs -a marblefun --no-tail 2>&1 | tail -80 || true
