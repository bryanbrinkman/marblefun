# Manual diagnostics for the marble artwork folders: lists both directories,
# runs the same discovery the server does, and dumps the material setup of a
# few GLBs (this is what the game has to light correctly). Run it from the
# Actions tab when the marbles look wrong; read the job log.
name: inspect-skins
on:
  workflow_dispatch:
    inputs:
      glbs:
        description: 'How many GLBs to inspect'
        default: '4'
  # Also runs whenever this file changes (dispatch needs a permission the
  # deploy integration lacks) — bump the `run:` comment below to re-run.
  push:
    paths: ['.github/workflows/inspect-skins.yml']

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Directory listings + discovery
        run: |
          node - <<'EOF'
          const { discoverSkins, fetchListing } = require('./src/skins');
          const { Tournament } = require('./src/tournament');
          const IMG = process.env.MARBLE_IMG_DIR || 'https://moccasin-faithful-asp-799.mypinata.cloud/ipfs/bafybeib74dmhx2kwpjirgov7mb2lwyghlhqyb5i5wn7if7hylcrzydktke/';
          const GLB = process.env.MARBLE_GLB_DIR || 'https://moccasin-faithful-asp-799.mypinata.cloud/ipfs/bafybeigr666ifcnkglwzfnq7d3bn2ve36f3hqrexlotm44c6drxhrbc3u4/';
          (async () => {
            for (const [label, dir] of [['IMAGES', IMG], ['MODELS', GLB]]) {
              console.log(`\n=== ${label} ${dir}`);
              try {
                const entries = await fetchListing(dir);
                console.log(entries.length + ' files');
                for (const e of entries) console.log('  ' + e.name + '  ->  ' + e.url);
              } catch (e) { console.log('LISTING FAILED: ' + e.message); }
            }
            const names = Array.from({ length: 100 }, (_, i) => Tournament.marbleNameFor(i + 1));
            const r = await discoverSkins({ imgDir: IMG, glbDir: GLB, names });
            console.log('\n=== DISCOVERY', JSON.stringify(r.stats), JSON.stringify(r.sources));
            const ids = Object.keys(r.manifest);
            console.log('matched marbles: ' + ids.length + ' → ' + ids.slice(0, 12).join(',') + (ids.length > 12 ? ',…' : ''));
            for (const id of ids.slice(0, 5)) console.log('  ' + id + ' ' + JSON.stringify(r.manifest[id]));
            require('fs').writeFileSync('manifest.json', JSON.stringify(r.manifest, null, 1));
          })();
          EOF
      - name: GLB headers + material dump
        run: |
          # run: 4
          node - "${{ github.event.inputs.glbs || '5' }}" <<'EOF'
          const fs = require('fs');
          const n = parseInt(process.argv[2] || '4', 10);
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const urls = Object.entries(manifest).filter(([, v]) => v.glb).slice(0, n);
          const img = Object.values(manifest).find((v) => v.img);
          (async () => {
            if (img) {
              const h = await fetch(img.img, { method: 'HEAD' });
              console.log('\n=== IMAGE HEAD', img.img, h.status, Object.fromEntries([...h.headers].filter(([k]) => /content-type|content-length|access-control/i.test(k))));
            }
            fs.mkdirSync('glbs', { recursive: true });
            for (const [id, v] of urls) {
              const res = await fetch(v.glb);
              const buf = Buffer.from(await res.arrayBuffer());
              fs.writeFileSync(`glbs/${id}.glb`, buf);
              console.log(`\n=== GLB #${id} ${v.glb}\n  HTTP ${res.status} ${buf.length} bytes`, Object.fromEntries([...res.headers].filter(([k]) => /content-type|access-control/i.test(k))));
              if (buf.readUInt32LE(0) !== 0x46546c67) { console.log('  not a GLB (magic mismatch); first bytes: ' + buf.slice(0, 64).toString('utf8')); continue; }
              const jsonLen = buf.readUInt32LE(12);
              const g = JSON.parse(buf.slice(20, 20 + jsonLen).toString('utf8'));
              console.log('  generator:', g.asset && g.asset.generator, ' extensionsUsed:', g.extensionsUsed);
              console.log('  nodes:', (g.nodes || []).map((x) => x.name + (x.scale ? ' scale=' + x.scale : '') + (x.rotation ? ' rot' : '')).join(' | '));
              console.log('  meshes:', (g.meshes || []).map((m) => `${m.name}[${m.primitives.map((p) => 'mat' + p.material + (p.attributes.COLOR_0 != null ? '+vcol' : '') + (p.attributes.TEXCOORD_0 != null ? '+uv' : '')).join(',')}]`).join(' | '));
              console.log('  images:', (g.images || []).length, ' textures:', (g.textures || []).length, ' samplers:', (g.samplers || []).length);
              // Embedded image sizes + pixel dimensions (PNG IHDR / JPEG SOF) — GPU memory on phones.
              const binStart = 20 + jsonLen + 8;
              (g.images || []).forEach((im, k) => {
                const bv = g.bufferViews[im.bufferView];
                const d = buf.slice(binStart + bv.byteOffset, binStart + bv.byteOffset + bv.byteLength);
                let dims = '?';
                if (d[0] === 0x89 && d[1] === 0x50) dims = d.readUInt32BE(16) + 'x' + d.readUInt32BE(20);
                else if (d[0] === 0xff && d[1] === 0xd8) { let o = 2; while (o < d.length) { if (d[o] !== 0xff) { o++; continue; } const mk = d[o + 1]; const len = d.readUInt16BE(o + 2); if (mk >= 0xc0 && mk <= 0xcf && mk !== 0xc4 && mk !== 0xc8 && mk !== 0xcc) { dims = d.readUInt16BE(o + 7) + 'x' + d.readUInt16BE(o + 5); break; } o += 2 + len; } }
                if (k < 3 || k === (g.images || []).length - 1) console.log(`  image[${k}] ${im.mimeType} ${bv.byteLength} bytes ${dims}`);
              });
              const meshVerts = (g.accessors || []).filter((a) => a.type === 'VEC3').reduce((t, a) => t + a.count, 0);
              console.log('  total VEC3 accessor elements:', meshVerts);
              (g.materials || []).forEach((m, i) => console.log(`  material[${i}] ${JSON.stringify(m)}`));
              // bounds of the first mesh position accessor
              const acc = (g.accessors || []).filter((a) => a.type === 'VEC3' && a.min && a.max);
              acc.slice(0, 3).forEach((a) => console.log('  bounds min=' + a.min.map((x) => x.toFixed(3)) + ' max=' + a.max.map((x) => x.toFixed(3))));
            }
          })();
          EOF
      - name: Measure the marble inside the 2D artwork (how much margin to zoom away)
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          import json, io, urllib.request
          from PIL import Image
          m = json.load(open('manifest.json'))
          for mid in ['1', '2', '3', '41', '98']:
              url = m.get(mid, {}).get('img')
              if not url: continue
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (inspect-skins)', 'Accept': 'image/*'})
              im = Image.open(io.BytesIO(urllib.request.urlopen(req).read())).convert('RGB')
              w, h = im.size
              px = im.load()
              # background = mean of the four corners; marble = pixels far from it
              corners = [px[0,0], px[w-1,0], px[0,h-1], px[w-1,h-1]]
              bg = tuple(sum(c[i] for c in corners)/4 for i in range(3))
              def far(p): return sum(abs(p[i]-bg[i]) for i in range(3)) > 60
              xs, ys = [], []
              step = max(1, w//400)
              for y in range(0, h, step):
                  for x in range(0, w, step):
                      if far(px[x,y]): xs.append(x); ys.append(y)
              if not xs: print(mid, 'no marble found'); continue
              bw, bh = max(xs)-min(xs), max(ys)-min(ys)
              cx, cy = (max(xs)+min(xs))/2, (max(ys)+min(ys))/2
              print(f"#{mid} {w}x{h} bg={tuple(round(c) for c in bg)} marble bbox x[{min(xs)},{max(xs)}] y[{min(ys)},{max(ys)}] size={bw}x{bh} diameter/width={bw/w:.3f} {bh/h:.3f} centre=({cx/w:.3f},{cy/h:.3f})")
              # Row profile through the centre: where does the sphere edge sit (ignoring a soft shadow)?
              row = [px[x, int(cy)] for x in range(w)]
              edges = [x for x in range(w) if far(row[x])]
              print(f"    centre-row extent x[{edges[0]},{edges[-1]}] -> {(edges[-1]-edges[0])/w:.3f} of width")
              col = [px[int(cx), y] for y in range(h)]
              e2 = [y for y in range(h) if far(col[y])]
              print(f"    centre-col extent y[{e2[0]},{e2[-1]}] -> {(e2[-1]-e2[0])/h:.3f} of height")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: skins-inspection
          path: |
            manifest.json
            glbs/
          if-no-files-found: ignore
